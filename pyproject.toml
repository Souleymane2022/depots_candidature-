[project]
name = "job-agent"
version = "0.1.0"
description = "Agent IA autonome de candidature automatique : score les offres, génère des lettres de motivation et soumet via navigateur piloté."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "job-agent contributors" }]
dependencies = [
    "anthropic>=0.40",
    "browser-use>=0.1.40",
    "playwright>=1.45",
    "patchright>=1.45",
    "imap-tools>=1.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "pypdf>=4.0",
    "cryptography>=42.0",
    "feedparser>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
job-agent = "job_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/job_agent"]
# Modules non couverts (intégration réseau ou orchestration testée à la main, hors brief).
omit = [
    "src/job_agent/cli.py",
    "src/job_agent/browser.py",
    "src/job_agent/imap_reader.py",
    "src/job_agent/agent.py",
    "src/job_agent/cv_adapter.py",
    "src/job_agent/logging_setup.py",
    "src/job_agent/config.py",
]

[tool.coverage.report]
# Le brief impose >= 70% sur email_pool, db, llm — c'est ce que le scope ci-dessus couvre.
fail_under = 70
show_missing = true
skip_covered = false
